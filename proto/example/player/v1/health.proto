syntax = "proto3";

package example.player.v1;

option go_package = "github.com/lfreixial/proto-opscope/gen/example/player/v1;playerv1";

// A plain service with NO fieldops annotations.
message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
}

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
